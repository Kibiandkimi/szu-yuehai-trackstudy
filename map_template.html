<script id="map-data" type="application/json">__MAP_DATA__</script>
<script>
'use strict';
(function () {
const raw = document.getElementById('map-data').textContent;
const status = document.getElementById('map-status');
if (raw.trim().startsWith('__')) { status.innerHTML = '这是地图模板，请打开 analyze.py 生成的 out/map.html 或 docs/index.html。'; return; }
const D = JSON.parse(raw);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = v => { const s = document.createElement('span'); s.textContent = v == null ? '' : String(v); return s.innerHTML; };
const fmt = (v, n = 1) => v == null || !isFinite(v) ? '—' : Number(v).toFixed(n);
const mins = s => s == null ? '—' : (s / 60).toFixed(1) + ' 分';
const MODE_ZH = {walk: '步行', bike: '骑行'}, PER_ZH = {off: '平峰', peak: '高峰'};

// ---------- 投影（与 Python tracks.xy 相同） ----------
const LAT0 = D.meta.lat0, LON0 = D.meta.lon0, KX = 111320 * Math.cos(LAT0 * Math.PI / 180), KY = 110574;
const toXY = (lon, lat) => [(lon - LON0) * KX, (lat - LAT0) * KY];

// ---------- 路段几何 ----------
const EDGES = D.edges.map((r, id) => {
  const [a, b, len, flat, name, hw, rise, ascent, descent, hk] = r;
  const ll = [], xs = [], ys = [];
  for (let i = 0; i < flat.length; i += 2) { ll.push([flat[i + 1], flat[i]]); const p = toXY(flat[i], flat[i + 1]); xs.push(p[0]); ys.push(p[1]); }
  const cs = [0]; for (let i = 1; i < xs.length; i++) cs.push(cs[i - 1] + Math.hypot(xs[i] - xs[i - 1], ys[i] - ys[i - 1]));
  const sc = len / Math.max(cs[cs.length - 1], 1e-9);
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  xs.forEach((x, i) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, ys[i]); y1 = Math.max(y1, ys[i]); });
  return {id, a, b, len, ll, xs, ys, cs: cs.map(c => c * sc), name, hw, rise, ascent, descent, hk: !!hk, box: [x0, x1, y0, y1]};
});
function project(e, px, py) {   // 与 network.project 相同
  let best = [0, Infinity];
  for (let i = 0; i < e.xs.length - 1; i++) {
    const dx = e.xs[i + 1] - e.xs[i], dy = e.ys[i + 1] - e.ys[i], L2 = dx * dx + dy * dy;
    const u = L2 === 0 ? 0 : Math.min(1, Math.max(0, ((px - e.xs[i]) * dx + (py - e.ys[i]) * dy) / L2));
    const d = Math.hypot(px - e.xs[i] - u * dx, py - e.ys[i] - u * dy);
    if (d < best[1]) best = [e.cs[i] + u * (e.cs[i + 1] - e.cs[i]), d];
  }
  return best;
}
function sub(e, s0, s1) {   // 路段上 s0→s1 的子线（LatLng）
  const lo = Math.min(s0, s1), hi = Math.max(s0, s1), pt = s => {
    let i = 1; while (i < e.cs.length - 1 && e.cs[i] < s) i++;
    const f = (s - e.cs[i - 1]) / Math.max(e.cs[i] - e.cs[i - 1], 1e-9);
    return [e.ll[i - 1][0] + f * (e.ll[i][0] - e.ll[i - 1][0]), e.ll[i - 1][1] + f * (e.ll[i][1] - e.ll[i - 1][1])];
  };
  const out = [pt(lo)]; e.cs.forEach((c, i) => { if (c > lo && c < hi) out.push(e.ll[i]); }); out.push(pt(hi));
  return s0 <= s1 ? out : out.reverse();
}

// ---------- 有向图与规划（与 routing.Planner 相同） ----------
const GRAPH = {};
function graph(key) {
  if (GRAPH[key]) return GRAPH[key];
  const C = D.cost[key], out = new Map(), inc = new Map();
  const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
  EDGES.forEach(e => {
    if (C[e.id][0] != null) { push(out, e.a, [e.b, C[e.id][0], e.id, 0]); push(inc, e.b, [e.a, C[e.id][0], e.id, 0]); }
    if (C[e.id][1] != null) { push(out, e.b, [e.a, C[e.id][1], e.id, 1]); push(inc, e.a, [e.b, C[e.id][1], e.id, 1]); }
  });
  return GRAPH[key] = {C, out, inc};
}
const WALK = D.meta.walk_speed, SNAP_R = D.meta.snap.r, SNAP_K = D.meta.snap.k;
function snap(lon, lat, key) {
  const C = D.cost[key], [px, py] = toXY(lon, lat), c = [];
  for (const e of EDGES) {
    if (C[e.id][0] == null && C[e.id][1] == null) continue;
    if (px < e.box[0] - SNAP_R || px > e.box[1] + SNAP_R || py < e.box[2] - SNAP_R || py > e.box[3] + SNAP_R) continue;
    const [s, d] = project(e, px, py); if (d <= SNAP_R) c.push([e.id, s, d]);
  }
  c.sort((p, q) => p[2] - q[2]); const near = c.slice(0, SNAP_K);   // 与 routing.Planner.snap 相同
  return near.filter(p => p[2] <= near[0][2] + D.meta.snap.slack).map(([e, s, d]) => [e, s, d * D.meta.snap.detour]);
}
class Heap { constructor() { this.a = []; }
  push(x) { const a = this.a; a.push(x); let i = a.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; [a[p], a[i]] = [a[i], a[p]]; i = p; } }
  pop() { const a = this.a, top = a[0], last = a.pop(); if (a.length) { a[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i;
    if (l < a.length && a[l][0] < a[m][0]) m = l; if (r < a.length && a[r][0] < a[m][0]) m = r; if (m === i) break; [a[m], a[i]] = [a[i], a[m]]; i = m; } } return top; }
  get size() { return this.a.length; } }
function tree(snaps, key, reverse = false, limit = Infinity) {
  const G = graph(key), adj = reverse ? G.inc : G.out, dist = new Map(), h = new Heap(), done = new Set();
  for (const [eid, s, acc] of snaps) {
    const e = EDGES[eid], a0 = acc / WALK;
    // 正向：从 s 走到 a 是反向(1)，到 b 是正向(0)；求“到达此点”时相反
    for (const [node, part, d] of [[e.a, s, reverse ? 0 : 1], [e.b, e.len - s, reverse ? 1 : 0]]) {
      const c = G.C[eid][d]; if (c == null) continue;
      const v = a0 + c * part / e.len;
      if (!dist.has(node) || v < dist.get(node)[0]) { dist.set(node, [v, null, [eid, s, d, acc]]); h.push([v, node]); }
    }
  }
  while (h.size) {
    const [c, u] = h.pop(); if (done.has(u) || c > limit) continue; done.add(u);
    for (const [v, w, eid, d] of adj.get(u) || []) { const nc = c + w; if (!dist.has(v) || nc < dist.get(v)[0]) { dist.set(v, [nc, u, [eid, d]]); h.push([nc, v]); } }
  }
  return dist;
}
function route(src, dst, key) {
  const G = graph(key), S = snap(src[0], src[1], key), T = snap(dst[0], dst[1], key);
  if (!S.length || !T.length) return null;
  const dist = tree(S, key); let best = null;
  for (const [eid, s, acc] of T) {
    const e = EDGES[eid];
    for (const [node, part, d] of [[e.a, s, 0], [e.b, e.len - s, 1]]) {
      const c = G.C[eid][d]; if (c == null || !dist.has(node)) continue;
      const v = dist.get(node)[0] + c * part / e.len + acc / WALK;
      if (!best || v < best.t) best = {t: v, node, end: [eid, s, d, acc]};
    }
  }
  for (const [e1, s1, a1] of S) for (const [e2, s2, a2] of T) {
    const d = s2 >= s1 ? 0 : 1, c = G.C[e1][d];
    if (e1 === e2 && c != null) { const v = (a1 + a2) / WALK + c * Math.abs(s2 - s1) / EDGES[e1].len;
      if (!best || v < best.t) best = {t: v, direct: [e1, s1, s2, d], acc: a1 + a2}; }
  }
  if (!best) return null;
  let arcs = [], geo = [], acc = 0;
  if (best.direct) { const [e, s1, s2, d] = best.direct; arcs = [[e, d, Math.abs(s2 - s1)]]; geo = sub(EDGES[e], s1, s2); acc = best.acc; }
  else {
    const [eid, s, d, a2] = best.end, E = EDGES[eid];
    arcs.push([eid, d, d === 0 ? s : E.len - s]); geo = sub(E, d === 0 ? 0 : E.len, s); acc = a2;
    let u = best.node;
    for (;;) {
      const [, prev, via] = dist.get(u);
      if (prev === null) { const [e0, s0, d0, a0] = via, E0 = EDGES[e0]; arcs.push([e0, d0, d0 === 0 ? E0.len - s0 : s0]);
        geo = sub(E0, s0, d0 === 0 ? E0.len : 0).concat(geo); acc += a0; break; }
      const [e1, d1] = via, E1 = EDGES[e1]; arcs.push([e1, d1, E1.len]); geo = (d1 === 0 ? E1.ll : E1.ll.slice().reverse()).concat(geo); u = prev;
    }
  }
  let up = 0, down = 0, net = 0;
  arcs.forEach(([e, d, p]) => { const E = EDGES[e], f = p / E.len; net += p; up += (d === 0 ? E.ascent : E.descent) * f; down += (d === 0 ? E.descent : E.ascent) * f; });
  const sup = arcs.reduce((s, [e, d, p]) => s + (D.support[key.split('_')[0]][e][d] > 0 ? p : 0), 0);
  return {t: best.t, dist: net + acc, net, up, down, geo, arcs, cover: net ? sup / net : 0};
}

// ---------- 地图 ----------
const m = L.map('m', {maxZoom: 19, zoomSnap: 0.5}).setView([22.5352, 113.9325], 16);
m.attributionControl.addAttribution('&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · 地形：DirMap 共享轨迹高程');
L.control.scale({imperial: false}).addTo(m);
m.createPane('base').style.zIndex = 190; m.createPane('net').style.zIndex = 300; m.createPane('over').style.zIndex = 420; m.createPane('top').style.zIndex = 460;
const rBase = L.canvas({pane: 'base'}), rNet = L.canvas({pane: 'net', tolerance: 5}), rOver = L.canvas({pane: 'over'}), rTop = L.canvas({pane: 'top'});
L.geoJSON(D.basemap, {pane: 'base', renderer: rBase, interactive: false, style: f => {
  const k = f.properties.kind;
  if (k === 'water') return {color: css('--water'), weight: 1, fillColor: css('--water'), fillOpacity: 1};
  if (k === 'building') return {color: css('--bld-line'), weight: 1, fillColor: css('--bld'), fillOpacity: 1};
  if (k === 'green') return {color: css('--green'), weight: 1, fillColor: css('--green'), fillOpacity: 1};
  return {color: css('--road-major'), weight: 5, opacity: 1};
}}).addTo(m);
const netLayer = L.layerGroup().addTo(m);
EDGES.forEach(e => L.polyline(e.ll, {renderer: rBase, pane: 'base', color: css('--road'), weight: /^(secondary|tertiary)/.test(e.hw) ? 4 : 2, interactive: false}).addTo(netLayer));
const placeLayer = L.layerGroup().addTo(m);
for (const [name, p] of Object.entries(D.places)) {
  L.circleMarker([p.lat, p.lon], {renderer: rTop, pane: 'top', radius: 4, color: css('--surface-1'), weight: 2, fillColor: css('--text-secondary'), fillOpacity: 1})
    .addTo(placeLayer).bindTooltip(esc(name), {permanent: true, direction: 'right', className: 'place', offset: [4, 0]});
}

// 颜色：效率 = 发散（红慢 – 灰 – 蓝快）；支持 / 可达圈 = 蓝色序数
const DIV = ['#b8312f', '#e8807e', '#a9a8a1', '#6da7ec', '#184f95'];
const effBin = r => r < 0.8 ? 0 : r < 0.93 ? 1 : r <= 1.07 ? 2 : r <= 1.25 ? 3 : 4;
const EFF_LBL = ['<0.8 慢', '0.8–0.93', '0.93–1.07', '1.07–1.25', '>1.25 快'];
const SEQ = ['#86b6ef', '#3987e5', '#184f95'];
const BEAR = ['东', '东北', '北', '西北', '西', '西南', '南', '东南'];
const bearing = (e, d) => { const i0 = d ? e.xs.length - 1 : 0, i1 = d ? 0 : e.xs.length - 1;
  const ang = Math.atan2(e.ys[i1] - e.ys[i0], e.xs[i1] - e.xs[i0]); return '向' + BEAR[((Math.round(ang / (Math.PI / 4)) % 8) + 8) % 8]; };

const st = {mode: 'bike', per: 'off', layer: 'eff', tool: 'route', A: null, B: null, iso: null, idir: 'out', prior: false};
const key = () => `${st.mode}_${st.per}`;
const over = L.layerGroup().addTo(m), routeLayer = L.layerGroup().addTo(m), isoLayer = L.layerGroup().addTo(m), kmlLayer = L.layerGroup().addTo(m);

function edgePopup(e) {
  const md = st.mode, k = key(), C = D.cost[k][e.id], ob = D.observed[md];
  const rows = [0, 1].map(d => {
    if (C[d] == null) return `<tr><td>${bearing(e, d)}</td><td colspan="4">${md === 'bike' ? '单行，不可逆行' : '不可通行'}</td></tr>`;

function drawOver() {

const ptXY = (e, s) => { s = Math.max(0, Math.min(e.len, s)); let i = 1; while (i < e.cs.length - 1 && e.cs[i] < s) i++;

const ISOS = {walk: [300, 600, 900], bike: [180, 300, 600]};

function drawIso() {
  isoLayer.clearLayers(); const box = document.getElementById('ires'); ISO = ISOS[st.mode];
  document.getElementById('ilg').innerHTML = ISO.map((t, i) => `<span><i style="background:${SEQ[2 - i]}"></i>≤${t / 60} 分钟</span>`).join('');
  if (!st.iso) { box.textContent = '选择地点或在地图上点一下。'; return; }
  const k = key(), C = D.cost[k], rev = st.idir === 'in', S = snap(st.iso[0], st.iso[1], k);
  if (!S.length) { box.textContent = '120 m 内没有可通行道路。'; return; }
  const dist = tree(S, k, rev, ISO[2] + 60);
  L.circleMarker([st.iso[1], st.iso[0]], {renderer: rTop, pane: 'top', radius: 7, color: css('--surface-1'), weight: 2, fillColor: css('--text-primary'), fillOpacity: 1}).addTo(isoLayer);
  const km = [0, 0, 0];
  for (let bi = ISO.length - 1; bi >= 0; bi--) {
    const lim = ISO[bi], color = SEQ[2 - bi];
    for (const e of EDGES) {
      // 出发圈：从 a 沿正向推进、从 b 沿反向；到达圈：走向 a 用反向、走向 b 用正向
      const fa = dist.get(e.a), fb = dist.get(e.b), ca = C[e.id][rev ? 1 : 0], cb = C[e.id][rev ? 0 : 1];

      if (fb && cb != null && fb[0] < lim) rb = Math.min(e.len, (lim - fb[0]) / (cb / e.len));

      segs.forEach(([s0, s1]) => L.polyline(sub(e, s0, s1), {renderer: rOver, pane: 'over', color, weight: 5, opacity: 0.9, interactive: false}).addTo(isoLayer));

    ISO.map((t, i) => `<span class="sw" style="background:${SEQ[2 - i]}"></span><b>${i ? ISO[i - 1] / 60 + '–' : '≤'}${t / 60} 分钟</b>（累计路网 ${fmt(km[i], 1)} km）：` +
      (reach.filter(r => r[1] <= t && (i === 0 || r[1] > ISO[i - 1])).map(r => `${esc(r[0])} ${fmt(r[1] / 60, 1)}′`).join('、') || '—')).join('<br>');
}

// ---------- 模型：坡度响应曲线（小多图：步行 / 骑行） ----------
function gradeChart(md) {
  const M = D.models[md], W = 330, H = 190, l = 40, r = 64, t = 12, b = 30;
  const series = [['本次学习', M.curve.map(p => p.learned), '--series-1'], ['DirMap 学习', M.dirmap_curve ? M.dirmap_curve.map(p => p.learned) : null, '--series-2'],
                  ['先验', M.curve.map(p => p.prior), '--series-3']].filter(s => s[1]);
  const gs = M.curve.map(p => p.grade), all = series.flatMap(s => s[1]);
  const y0 = Math.min(0.7, ...all), y1 = Math.max(1.4, ...all);
  const X = g => l + (g - gs[0]) / (gs[gs.length - 1] - gs[0]) * (W - l - r), Y = v => t + (y1 - v) / (y1 - y0) * (H - t - b);
  const ticks = []; for (let v = Math.ceil(y0 * 10) / 10; v <= y1 + 1e-9; v += 0.1) ticks.push(+v.toFixed(1));
  const rng = M.dirmap && M.grade_range ? M.grade_range : null;
  let svg = `<svg width="${W}" height="${H}" role="img" aria-label="${MODE_ZH[md]}坡度对耗时的影响">`;
  ticks.forEach(v => svg += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css(v === 1 ? '--axis' : '--grid')}" stroke-width="1"/>${v % 0.2 < 1e-6 || v === 1 ? `<text x="${l - 4}" y="${Y(v) + 4}" text-anchor="end">${v.toFixed(1)}×</text>` : ''}`);
  [-0.08, -0.04, 0, 0.04, 0.08].forEach(g => svg += `<text x="${X(g)}" y="${H - b + 15}" text-anchor="middle">${g > 0 ? '+' : ''}${Math.round(g * 100)}%</text>`);
  svg += `<text x="${(l + W - r) / 2}" y="${H - 2}" text-anchor="middle">坡度（行进方向，下坡为负）</text>`;
  if (rng) svg += `<rect x="${X(rng[0] / 100)}" y="${t}" width="${X(rng[1] / 100) - X(rng[0] / 100)}" height="${H - t - b}" fill="${css('--grid')}" opacity="0.35"/>`;
  series.forEach(([name, v, c]) => { svg += `<polyline fill="none" stroke="${css(c)}" stroke-width="2" points="${v.map((y, i) => `${X(gs[i])},${Y(y)}`).join(' ')}"/>`;
    svg += `<text x="${W - r + 4}" y="${Y(v[v.length - 1]) + 4}" style="fill:${css('--text-secondary')}">${name}</text>`; });
  svg += `<line class="xh" x1="0" x2="0" y1="${t}" y2="${H - b}" stroke="${css('--axis')}" visibility="hidden"/>`;
  svg += `<rect x="${l}" y="${t}" width="${W - l - r}" height="${H - t - b}" fill="transparent" class="hit"/></svg>`;
  return {svg, series, gs, X, l, r, W};
}

      <div class="small">${[['本次学习', '--series-1'], ['DirMap 学习', '--series-2'], ['先验', '--series-3']].map(([n, v]) => `<span class="sw" style="background:${css(v)}"></span>${n}`).join('　')}</div>
      ${c.svg}<div class="tt"></div>
      <div class="small muted">θ = [${M.theta.join(', ')}]${M.dirmap ? `；DirMap = [${M.dirmap.coefficients.map(v => v.toFixed(2)).join(', ')}]（${M.dirmap.tracks} 条）` : ''}<br>

  const mt = ['walk', 'bike'].map(md => { const M = D.models[md];
    return `<tr><td>${MODE_ZH[md]}</td><td>${fmt(M.base_mps, 2)} m/s</td><td>${M.tracks} 条 / ${M.episodes} 段 / ${M.observations} 观测 / ${fmt(M.observed_m / 1000, 1)} km</td>
      <td>${Object.entries(M.peak).map(([k, v]) => `${k === 'road' ? '车行道' : '步行空间'} ×${fmt(1 / v, 2)}（${M.n_peak[k]} 观测）`).join('<br>')}</td>
      <td>${Object.entries(M.classes).map(([k, v]) => `${esc(k)} ${fmt(v, 2)}`).join('，')}</td><td>${fmt(M.residual_mad, 3)}</td></tr>`; }).join('');
  return `${charts}
    <h3>模型参数</h3><table><tr><th>方式</th><th>平路基准</th><th>数据</th><th>高峰耗时倍数</th><th>道路类别效率（含先验）</th><th>残差 MAD</th></tr>${mt}</table>
    <div class="small muted">跑步与步行共享坡度/道路效应（各自有配速项），与 DirMap foot 模型一致；骑行单独。高峰倍数 &gt;1 表示更慢。</div>
    <h3>验证</h3>${vt}<div class="small muted">去掉整条记录重拟合后预测它在实际路径上的移动耗时；误差主要来自每次出行本身的快慢（同一人骑行 3–6 m/s）。“前40%校准”用该记录前 40% 路程估计当天配速、只评估后 60%。</div>
    <h3>路线选择校验</h3><table><tr><th>通勤记录</th><th>时段</th><th>规划与实际重合</th><th>长度 规划 / 实际(路网) / GPS</th><th>模型估时 规划 / 实际路线</th><th>实测</th></tr>${ch}</table>
    <div class="small muted">用实测起终点重新规划；重合度低而“模型估时”接近说明存在几条差不多快的路线。实际路线估时只含匹配到路网的部分（广场、楼内等离网段不计入），实测含停留。</div>`;
};
TABS.model.after = () => document.querySelectorAll('.chart').forEach(div => {
  const md = div.dataset.md, c = gradeChart(md), svg = div.querySelector('svg'), tt = div.querySelector('.tt'), xh = svg.querySelector('.xh');

// ---------- KML 预览（浏览器本地解析，不上传） ----------
function parseTrack(text, name) {
  const pts = [];
  if (/\.gpx$/i.test(name) || /<gpx[\s>]/.test(text)) {
    for (const m_ of text.matchAll(/<trkpt\b([^>]*)>([\s\S]*?)<\/trkpt>/g)) {
      const la = /lat="([^"]+)"/.exec(m_[1]), lo = /lon="([^"]+)"/.exec(m_[1]), tm = /<time>([^<]+)<\/time>/.exec(m_[2]);
      if (la && lo && tm) pts.push([Date.parse(tm[1]) / 1000, +lo[1], +la[1]]);
    }
  } else {
    for (const blk of text.matchAll(/<gx:Track\b[\s\S]*?<\/gx:Track>/g)) {
      const w = [...blk[0].matchAll(/<when>([^<]+)<\/when>/g)].map(x => Date.parse(x[1]) / 1000), c = [...blk[0].matchAll(/<gx:coord>([^<]+)<\/gx:coord>/g)].map(x => x[1].trim().split(/\s+/).map(Number));
      w.forEach((t, i) => c[i] && pts.push([t, c[i][0], c[i][1]]));
    }
  }
  return pts.filter(p => isFinite(p[0]) && isFinite(p[1]) && isFinite(p[2])).sort((a, b) => a[0] - b[0]);
}
function classify(pts) {   // 与 tracks.classify 相同
  const b = new Map(); pts.forEach(([t, lo, la]) => { const k = Math.floor((t - pts[0][0]) / 5); const [x, y] = toXY(lo, la);
    const v = b.get(k) || [0, 0, 0, 0]; v[0] += x; v[1] += y; v[2] += t; v[3]++; b.set(k, v); });
  const P = [...b.values()].map(v => [v[0] / v[3], v[1] / v[3], v[2] / v[3]]), V = [];
  for (let i = 1; i < P.length; i++) { const dt = P[i][2] - P[i - 1][2]; if (dt > 0 && dt < 30) V.push(Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]) / dt); }
  const q = (a, p) => { const s = a.slice().sort((x, y) => x - y); if (!s.length) return NaN; const i = (s.length - 1) * p, lo = Math.floor(i); return s[lo] + (s[Math.min(lo + 1, s.length - 1)] - s[lo]) * (i - lo); };
  const mv = V.filter(v => v >= 0.5 && v <= 15); if (mv.length < 10) return ['unknown', '有效移动太少', V];
  const p50 = q(mv, .5), p90 = q(mv, .9), fast = V.filter(v => v > 2.3 && v < 15);
  const mean = fast.reduce((s, v) => s + v, 0) / fast.length, cv = fast.length >= 20 ? Math.sqrt(fast.reduce((s, v) => s + (v - mean) ** 2, 0) / fast.length) / mean : null;
  const p95 = fast.length >= 20 ? q(fast, .95) : 0, dur = pts[pts.length - 1][0] - pts[0][0];
  const desc = `移动中位 ${fmt(p50, 2)} m/s，P90 ${fmt(p90, 2)}` + (cv != null ? `，快段变异 ${fmt(cv, 2)}` : '');
  if (p50 < 1.8 && p90 < 2.6) return ['walk', desc, V];
  if (cv == null) return ['unknown', desc + '（快段太少）', V];
  if (cv < 0.13) return ['run', desc, V];
  if (p95 >= 6.0 || (cv >= 0.25 && p95 >= 5.0 && dur < 1200)) return ['bike', desc, V];
  return ['unknown', desc + '（跑步/骑行难以区分）', V];
}
TABS.kml = () => `<div id="drop">把 KML（两步路 gx:Track）或 GPX 拖到这里或地图上，或 <input type="file" id="kfile" accept=".kml,.gpx" multiple><br>
  <span class="small">只在本机浏览器解析，不会上传。</span></div><div id="kres" class="small"></div>
  <h3>加入分析</h3><div class="small">在 trackstudy 目录：<code>python3 tracks.py add 文件.kml --mode bike</code>（或放进微信/下载目录后 <code>python3 tracks.py scan</code>）→ <code>python3 analyze.py</code>。
  按内容去重；方式优先级：手动 &gt; DirMap 标签 &gt; 自动识别（跑步与骑行难以区分时标 unknown，需手动标注）。<code>python3 tracks.py list</code> 查看全部。</div>`;
TABS.kml.after = () => { const f = document.getElementById('kfile'); f.onchange = () => handleFiles(f.files); bindDrop(document.getElementById('drop')); };
function bindDrop(el) {
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); handleFiles(e.dataTransfer.files); });
}
bindDrop(m.getContainer());
async function handleFiles(files) {
  if (tab !== 'kml') document.querySelector('[data-tab=kml]').click();
  kmlLayer.clearLayers(); const out = [];
  for (const file of files) {
    const pts = parseTrack(await file.text(), file.name);
    if (pts.length < 3) { out.push(`<p><b>${esc(file.name)}</b>：没有带时间的轨迹点（无法测速）。</p>`); continue; }
    const [mode, desc] = classify(pts), dur = pts[pts.length - 1][0] - pts[0][0];
    let len = 0; const ll = pts.map(p => [p[2], p[1]]);
    for (let i = 1; i < pts.length; i++) { const a = toXY(pts[i - 1][1], pts[i - 1][2]), b = toXY(pts[i][1], pts[i][2]); len += Math.hypot(b[0] - a[0], b[1] - a[1]); }
    // 按速度分段着色（单色序数：浅 = 慢，深 = 快）
    const cut = mode === 'bike' ? [2, 4] : [0.9, 1.4];
    for (let i = 1; i < pts.length; i++) { const a = toXY(pts[i - 1][1], pts[i - 1][2]), b = toXY(pts[i][1], pts[i][2]), v = Math.hypot(b[0] - a[0], b[1] - a[1]) / Math.max(pts[i][0] - pts[i - 1][0], 1);
      L.polyline([ll[i - 1], ll[i]], {renderer: rTop, pane: 'top', color: SEQ[v < cut[0] ? 0 : v < cut[1] ? 1 : 2], weight: 4, interactive: false}).addTo(kmlLayer); }
    const md = mode === 'bike' ? 'bike' : 'walk', a = [pts[0][1], pts[0][2]], z = [pts[pts.length - 1][1], pts[pts.length - 1][2]];
    const r = route(a, z, `${md}_off`);
    out.push(`<p><b>${esc(file.name)}</b>：${new Date(pts[0][0] * 1000).toLocaleString('zh-CN', {timeZone: 'Asia/Shanghai', hour12: false})}，${fmt(dur / 60, 1)} 分钟，${fmt(len, 0)} m，${pts.length} 点。<br>
      自动识别：<b>${{walk: '步行', run: '跑步', bike: '骑行', unknown: '无法确定'}[mode]}</b>（${esc(desc)}）。<br>
      ${r ? `模型（${MODE_ZH[md]}平峰）起点→终点最快路线 ${mins(r.t)}、${fmt(r.dist, 0)} m；实测 ${fmt(dur / 60, 1)} 分（比模型${dur > r.t ? '慢' : '快'} ${fmt(100 * Math.abs(dur / r.t - 1), 0)}%${dur > r.t ? '，实测含停留/绕行' : ''}）。` : '起终点附近没有路网，无法对比。'}<br>
      <span class="muted">加入分析：<code>python3 tracks.py add "${esc(file.name)}"${mode === 'unknown' ? ' --mode walk|run|bike' : ''}</code></span></p>`);
    if (ll.length) m.fitBounds(L.latLngBounds(ll).pad(0.2));
  }
  document.getElementById('kres').innerHTML = out.join('') + `<div class="lg small">速度：${['慢', '中', '快'].map((t, i) => `<span><i style="background:${SEQ[i]}"></i>${t}</span>`).join('')}</div>`;
}
TABS.about = () => { const M = D.meta;
  return `<div class="small">
  <p><b>数据</b>：${M.tracks.walk} 条步行、${M.tracks.run} 条跑步、${M.tracks.bike} 条骑行轨迹（校内）；${D.meta.public ? '公开版不含逐轨迹时间与原始轨迹。' : '本地完整版。'}生成于 ${esc(M.generated)}。
  地形：${M.terrain ? `DirMap ${esc(M.terrain.name)} 共享轨迹高程（${esc(M.terrain.schema)}，${M.terrain.spacing} m 网格，${M.terrain.range[0]}–${M.terrain.range[1]} m）` : '未同步，按平地'}；路网：OSM。</p>
  <p><b>道路识别</b>：HMM 地图匹配——候选路段垂距（σ 7 m）+ 行进方向与路段切线夹角；转移代价 = |路网距离 − GPS 直线距离| / 8 m（有截断 Dijkstra）+ 逆行惩罚，可区分紧邻平行路、避免路口假倒退；楼内/操场为“离网”状态。匹配点之间的路网路径按长度分配时间，得到“记录 × 路段 × 方向”的通行观测。</p>
  <p><b>通行效率</b>：log(秒/米) 稳健回归（与 DirMap foot-efficiency-corridor-v2 同构）：每条记录的配速项（不惩罚）+ 方向性坡度（上坡 / ≤5% 缓下坡 / 陡下坡，向先验收缩）+ 道路类别（台阶上/下行分开；骑行走步道、人行天桥有推车先验）+ 路段效应 + 方向残差 + 高峰（车行道/步行空间分开）。约每 40 m 一份权重，同一记录同一路段同一方向最多 5 份。</p>
  <p><b>规划</b>：有向图，A→B 与 B→A 分别计算；骑行遵守单行。起终点投影到 120 m 内最近的路段（另保留比最近者远不超过 25 m 的至多 2 条备选），门到路按直线 ×1.3 步行。高峰 = 工作日开课前 15 分钟、下课后 15 分钟、节间 ±3 分钟。</p>
  <p><b>局限</b>：样本少（尤其骑行高峰），路段效应大多被收缩到类别水平；每次出行本身快慢差异大于道路差异。GPS 难以区分极近的平行路。坡度效应是“经配速调整后的相关”，非因果证明。</p></div>`; };
